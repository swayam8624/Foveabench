name: FB-LEARN-01 supervised neural training
on:
  push:
  pull_request:
jobs:
  supervised-training:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural training dependencies
        run: python -m pip install -e .
      - name: Generate causal Phase 1 model data
        run: python -m foveabench.phase1 run --output results/learn-input --seed 20261010
      - name: Train and evaluate real NumPy neural net
        run: |
          python -m foveabench.learn train --phase1-frames results/learn-input/frames.csv --output results/learn-ci --epochs 30 --patience 12
          cat results/learn-ci/report.md
      - name: Audit checkpoint and held-out evidence
        run: |
          python - <<'PY'
          import json,csv,numpy as np,pathlib
          p=pathlib.Path('results/learn-ci')
          m=json.loads((p/'manifest.json').read_text())
          assert m['suite']=='FB-LEARN-01/1.0'
          assert m['test_pairs']>0 and m['best_epoch']>0
          assert m['train_identities']>0 and m['test_identities']>0
          with np.load(p/'model.npz',allow_pickle=False) as f:
              assert f['w1'].shape==(9,24)
              assert np.isfinite(f['w1']).all()
          rows=list(csv.DictReader((p/'test_metrics.csv').open()))
          assert {'hold','velocity','learned'}=={r['model'] for r in rows if r['movement']=='ALL'}
          print('ML_TRAINING_PASS',m['best_epoch'],m['heldout_learned_mean_deg'])
          PY
      - name: Test learned model rendering data interchange
        run: python -m unittest discover -s tests -p test_learn_bridge.py -v
      - name: Install Vulkan for learned predictor rendering comparison
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libvulkan-dev mesa-vulkan-drivers glslang-tools
      - name: Execute paired trained hold and velocity Vulkan renderer
        run: |
          python -m foveabench.learn_bridge prepare --ml-output results/learn-ci --output results/learn-render-ci --condition latency-60 --max-frames 24
          python -m foveabench.learn_bridge render --prepared results/learn-render-ci
          test -f results/learn-render-ci/comparison.csv
          cat results/learn-render-ci/report.md
      - name: Check transfer evaluator contracts
        run: python -m unittest discover -s tests -p test_learn_transfer.py -v
      - name: Inspect saved original ML blending decisions
        run: python -m foveabench.learn_transfer inspect --ml-output results/learn-ci
      - name: Generate unseen synthetic identities for frozen-model transfer
        run: |
          python - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path('benchmark_spec/profiles/fb-gaze-01.json').read_text())
          p['synthetic_sessions_per_kind']=5
          pathlib.Path('results/transfer-profile.json').write_text(json.dumps(p))
          PY
          python -m foveabench.phase1 run --config results/transfer-profile.json --output results/transfer-input --seed 20261023
          python -m foveabench.learn_transfer evaluate --ml-output results/learn-ci --phase1-frames results/transfer-input/frames.csv --output results/transfer-ci
          cat results/transfer-ci/report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-learn-supervised
          path: |
            results/learn-ci/
            results/learn-render-ci/
            results/transfer-ci/