name: FoveaBench reference-model validation
on:
  push:
  pull_request:
jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Execute synthetic smoke experiment
        run: python -m foveabench run --preset smoke --output results/ci-smoke
      - name: Check generated evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('results/ci-smoke/manifest.json').read_text())
          assert all(v != 'FAIL' for v in m['checks'].values())
          assert m['checks']['full_reference_pixel_identical']=='PASS'
          assert Path('results/ci-smoke/overview.svg').exists()
          print(m['checks'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-model-smoke
          path: results/ci-smoke/
