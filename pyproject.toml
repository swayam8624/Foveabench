[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foveabench"
version = "0.1.0"
description = "Deterministic gaze replay and foveation reference experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "tqdm>=4.66,<5"]

[project.scripts]
foveabench = "foveabench.__main__:main"

[tool.setuptools.packages.find]
include = ["foveabench*"]
